<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <title>我们的第二世界</title>
  <style>
    :root{--bg:#090909;--paper:#f7f3ed;--ink:#191816;--muted:#99938b;--pink:#ef87ad;--blue:#6dc8ed;--violet:#ae9df8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{color:#f6f3ee;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}
    .app{width:min(100%,560px);min-height:100svh;margin:auto;padding:0 18px 46px;background:radial-gradient(circle at 82% 9%,rgba(255,255,255,.08),transparent 17rem),var(--bg)}
    .header{min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:12px 2px 8px}.brand strong{display:block;font:700 18px/1 Georgia,"Songti SC",serif;letter-spacing:-.04em}.brand span{display:block;margin-top:4px;color:rgba(246,243,238,.55);font-size:9px;letter-spacing:.11em}.badge{padding:6px 9px;border:1px solid rgba(255,255,255,.15);border-radius:999px;color:rgba(246,243,238,.68);font-size:9px;letter-spacing:.08em}
    .compare{text-align:center}.compare-frame{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:#e7e2da;box-shadow:0 20px 34px rgba(0,0,0,.36);isolation:isolate}.compare-frame img,.after-layer{position:absolute;inset:0;width:100%;height:100%}.compare-frame img{display:block;object-fit:cover}.before{z-index:1}.after-layer{z-index:2;overflow:hidden;background:var(--paper)}.after{object-position:center}.label{position:absolute;top:14px;z-index:4;padding:6px 10px;border-radius:999px;color:#fff;background:rgba(21,21,20,.76);font-size:10px;font-weight:600}.label.after-label{left:14px}.label.before-label{right:14px}.handle{position:absolute;top:0;bottom:0;z-index:5;width:1px;background:#fff;transform:translateX(-.5px);pointer-events:none}.handle span{position:absolute;top:50%;left:50%;display:grid;place-items:center;width:34px;height:34px;transform:translate(-50%,-50%);border:1px solid rgba(0,0,0,.1);border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);color:#252422;font-size:17px}.slider{position:absolute;inset:0;z-index:6;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;appearance:none}.caption h1{margin:27px 0 10px;font:700 25px/1 Georgia,"Songti SC",serif;letter-spacing:-.06em}.caption p{max-width:460px;margin:0 auto;color:rgba(246,243,238,.58);font-size:12px;line-height:1.8}
    .controls{padding:24px 17px 0}.picker-row{display:flex;align-items:center;gap:12px}.picker{flex:0 0 auto;padding:10px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:#f5f1eb;color:#181715;font-size:12px}.picker-note{color:rgba(246,243,238,.44);font-size:10px;line-height:1.45}.hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.selected-photo{display:none;align-items:center;gap:10px;margin-top:15px;padding:10px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:rgba(255,255,255,.07);font-size:11px}.selected-photo.show{display:flex}.selected-photo img{width:45px;height:45px;border-radius:8px;object-fit:cover}.selected-photo span{color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mode{display:flex;align-items:center;gap:9px;margin-top:18px;color:rgba(255,255,255,.5);font-size:10px}.mode strong{color:rgba(255,255,255,.82);font-size:11px;font-weight:500}.mode i{margin-left:auto;color:#e7b8cb;font-size:17px;font-style:normal}.generate{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:22px;padding:17px 25px;border:0;border-radius:999px;background:linear-gradient(105deg,var(--blue),var(--violet) 53%,var(--pink));box-shadow:0 0 24px rgba(144,162,246,.48);color:#151515;font-size:16px;font-weight:800}.generate b{font-size:22px;font-weight:400}.message{min-height:20px;margin:13px 0 0;color:rgba(255,255,255,.66);font-size:11px;line-height:1.6;text-align:center}.analysis{display:none;margin:18px 0 0;padding:14px 15px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(255,255,255,.07);text-align:left}.analysis.show{display:block}.analysis strong{font-size:12px}.analysis p{margin:8px 0 0;color:rgba(255,255,255,.7);font-size:11px;line-height:1.6}
    .toast{position:fixed;right:18px;bottom:20px;left:18px;z-index:20;width:min(calc(100% - 36px),524px);margin:auto;padding:14px 15px 12px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:#1c1b19;box-shadow:0 13px 32px rgba(22,20,18,.2)}.toast[hidden]{display:none}.toast-line{display:flex;align-items:center;gap:10px}.toast-line strong{min-width:38px;color:#f5b0ca;font-size:15px}.toast-line span{color:rgba(255,255,255,.84);font-size:11px;line-height:1.45}.progress{height:3px;margin-top:11px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.15)}.progress i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width .35s ease}
    .result{min-height:100svh;background:#050505;color:#fff}.result[hidden]{display:none}.result-top{display:flex;align-items:center;justify-content:space-between;width:min(100%,560px);margin:auto;padding:16px 18px}.icon,.history{border:0;background:transparent;color:#fff}.icon{width:33px;height:33px;font-size:32px;font-weight:200;line-height:1}.history{padding:9px 16px;border-radius:999px;background:rgba(115,116,124,.47);font-size:16px}.result-content{width:min(calc(100% - 36px),500px);margin:10px auto 0}.result-image{display:block;width:100%;max-height:70svh;object-fit:contain;background:#f4eee7}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.result-actions button{padding:14px 15px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(255,255,255,.02);color:#f1ca55;font-size:22px}.result-actions span{margin-left:8px;font-size:16px}.retry{width:100%;margin-top:26px;padding:17px;border:0;border-radius:999px;background:linear-gradient(105deg,var(--pink),var(--blue),var(--violet));color:#171515;font-size:18px;font-weight:800}
    @media(min-width:700px){.app{padding-right:42px;padding-left:42px}.compare{padding-top:14px}}
  </style>
</head>
<body>
  <main id="home" class="app">
    <header class="header"><div class="brand"><strong>第二世界</strong><span>照片重构实验</span></div><span class="badge">3:4 海报</span></header>
    <section class="compare">
      <div class="compare-frame">
        <img class="before" src="./home-before.png" alt="生成前参考图" />
        <div id="afterLayer" class="after-layer" style="clip-path:inset(0 50% 0 0)"><img class="after" src="./home-after.png" alt="生成后参考图" /></div>
        <span class="label after-label">生成后</span><span class="label before-label">生成前</span>
        <div id="handle" class="handle" style="left:50%"><span>↔</span></div>
        <input id="slider" class="slider" type="range" min="8" max="92" value="50" aria-label="左右滑动查看生成前后" />
      </div>
      <div class="caption"><h1>重构异世界</h1><p>拖动中间的分界线，看看一张合照如何长出另一个世界。</p></div>
    </section>
    <section class="controls">
      <input id="fileInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp" />
      <div class="picker-row"><button id="pickButton" class="picker" type="button">▣ <span>选择合照</span></button><span class="picker-note">AI 会先读懂照片，再决定连接方式</span></div>
      <div id="selectedPhoto" class="selected-photo"><img id="preview" alt="已选择的照片" /><span id="fileName"></span></div>
      <div id="analysis" class="analysis"><strong>✦ 照片分析完成</strong><p id="analysisText"></p></div>
      <div class="mode"><span>创作方式</span><strong>自由分析 · 每张照片都不同</strong><i>✦</i></div>
      <button id="generateButton" class="generate" type="button" disabled><span>立即生成</span><b>→</b></button>
      <p id="message" class="message">选择一张合照，先分析，再生成</p>
    </section>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"><div class="toast-line"><strong id="toastValue">0%</strong><span id="toastText"></span></div><div class="progress"><i id="progressBar"></i></div></div>
  </main>

  <main id="result" class="result" hidden>
    <header class="result-top"><button id="backButton" class="icon" type="button" aria-label="返回">‹</button><button class="history" type="button">◷ <span>生成记录</span></button><button id="shareTop" class="icon" type="button" aria-label="分享">↗</button></header>
    <section class="result-content"><img id="resultImage" class="result-image" alt="生成的第二世界海报" /><div class="result-actions"><button id="saveButton" type="button">⇩ <span>保存</span></button><button id="shareButton" type="button">□ <span>分享</span></button></div><button id="retryButton" class="retry" type="button">再次生成</button></section>
  </main>

  <script>
    (() => {
      const MAX_BYTES = 4 * 1024 * 1024;
      const allowed = new Set(["image/jpeg", "image/png", "image/webp"]);
      const apiBase = window.SECOND_WORLD_API_BASE || "";
      const $ = (id) => document.getElementById(id);
      const slider = $("slider"), afterLayer = $("afterLayer"), handle = $("handle");
      const fileInput = $("fileInput"), pickButton = $("pickButton"), generateButton = $("generateButton");
      const message = $("message"), toast = $("toast"), toastValue = $("toastValue"), toastText = $("toastText"), progressBar = $("progressBar");
      const home = $("home"), result = $("result"), preview = $("preview"), selectedPhoto = $("selectedPhoto"), fileName = $("fileName"), analysis = $("analysis"), analysisText = $("analysisText");
      let selectedFile = null, selectedData = null, analysisData = null, resultData = null, timer = null, generationCount = 0;
      function setSplit(value){ const n = Number(value); afterLayer.style.clipPath = `inset(0 ${100-n}% 0 0)`; handle.style.left = n + "%"; }
      slider.addEventListener("input", (e) => setSplit(e.target.value));
      function setMessage(text, error){ message.textContent = text; message.style.color = error ? "#e48a8a" : "rgba(255,255,255,.66)"; }
      function setToast(percent, text){ toast.hidden = false; toastValue.textContent = percent + "%"; toastText.textContent = text; progressBar.style.width = percent + "%"; }
      function hideToast(){ toast.hidden = true; }
      function dataUrl(file){ return new Promise((resolve,reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result)); reader.onerror = () => reject(new Error("照片读取失败，请重新选择")); reader.readAsDataURL(file); }); }
      async function json(path, options){ const response = await fetch(apiBase + path, options); const data = await response.json().catch(() => ({})); if(!response.ok || !data.ok) throw new Error(data.message || "生成服务暂时不可用"); return data; }
      async function analyze(file){
        setToast(18, "正在分析照片里的小细节…"); setMessage("正在分析照片里的小细节…");
        try {
          const image = await dataUrl(file); selectedData = image;
          const data = await json("/api/analyze-second-world", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({image, filename:file.name, mimeType:file.type})});
          analysisData = data.analysis; analysisText.textContent = `${analysisData.scene} · 连接元素：${analysisData.connection_element}`; analysis.classList.add("show"); generateButton.disabled = false; hideToast(); setMessage("分析完成，可以生成你们的第二世界");
        } catch (error) { hideToast(); setMessage(error instanceof Error ? error.message : "照片分析失败，请稍后再试", true); }
      }
      pickButton.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => { const file = fileInput.files && fileInput.files[0]; if(!file) return; if(!allowed.has(file.type)){setMessage("目前支持 JPG、PNG、WEBP；HEIC 请先转换为 JPG",true);return} if(file.size>MAX_BYTES){setMessage("照片大小不能超过 4MB，请压缩后再试",true);return} selectedFile=file; fileName.textContent=file.name; preview.src=URL.createObjectURL(file); selectedPhoto.classList.add("show"); analysisData=null; analysis.classList.remove("show"); generateButton.disabled=true; analyze(file); });
      function startProgress(){ let p=42; setToast(p,"正在生成创意拼贴…"); timer=setInterval(() => { p=Math.min(94,p+2); setToast(p,"图片生成中"); },650); }
      async function generate(){
        if(!selectedFile || !analysisData){setMessage("请先选择照片并等待分析完成",true);return} if(generationCount>=3){setMessage("本次最多生成 3 次，请重新上传照片后再试",true);return}
        generationCount++; generateButton.disabled=true; startProgress();
        try {
          const image = selectedData || await dataUrl(selectedFile); const seed=Date.now()%999999;
          const job=await json("/api/start-second-world",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({image,filename:selectedFile.name,mimeType:selectedFile.type,analysis:analysisData,variation_seed:seed})});
          const background=await fetch(apiBase+"/api/generate-second-world-background",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({job_id:job.job_id,variation_seed:seed})}); if(!background.ok&&background.status!==202) throw new Error("后台生成任务启动失败，请稍后再试");
          for(let i=0;i<90;i++){await new Promise(r=>setTimeout(r,1000));const current=await json("/api/second-world-status?job_id="+encodeURIComponent(job.job_id));const p=Math.min(94,Number(current.progress)||48);setToast(p,"图片生成中");if(current.status==="ready"&&current.image){resultData=current.image;break}}
          if(!resultData) throw new Error("图片生成超时，请稍后再试"); clearInterval(timer);setToast(100,"第二世界已生成！");setTimeout(showResult,260);
        } catch(error){clearInterval(timer);hideToast();generateButton.disabled=false;setMessage(error instanceof Error ? error.message : "图片生成失败，请稍后再试",true)}
      }
      generateButton.addEventListener("click", generate);
      function showResult(){hideToast();home.hidden=true;result.hidden=false;$("resultImage").src=resultData;}
      function back(){result.hidden=true;home.hidden=false;}
      $("backButton").addEventListener("click",back);$("retryButton").addEventListener("click",()=>{back();generate()});
      function save(){if(!resultData)return;const a=document.createElement("a");a.href=resultData;a.download="couple-second-world.png";a.click();setMessage("图片已保存到设备")}
      async function share(){if(!resultData)return;try{const blob=await fetch(resultData).then(r=>r.blob());const f=new File([blob],"couple-second-world.png",{type:"image/png"});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({title:"我们的第二世界",text:"这是我们的第二世界",files:[f]});}else{setMessage("当前设备不支持直接分享，请先保存图片")}}catch{setMessage("分享已取消")}}
      $("saveButton").addEventListener("click",save);$("shareButton").addEventListener("click",share);$("shareTop").addEventListener("click",share);
      setSplit(50);
    })();
  </script>
</body>
</html>
