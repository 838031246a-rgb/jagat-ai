name: 发布第二世界网页

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 下载已验证网页
        env:
          SOURCE: https://second-world-studio.prettyreed8.chatgpt.site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/assets
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          curl --retry 4 --retry-all-errors -fsSL -A "$UA" "$SOURCE/" -o site/index.html
          grep -oE '/assets/[A-Za-z0-9_.-]+' site/index.html | sort -u | while IFS= read -r remote; do
            mkdir -p "site$(dirname "$remote")"
            curl --retry 4 --retry-all-errors -fsSL -A "$UA" "$SOURCE$remote" -o "site$remote"
          done
          for remote in /home-before.png /home-after.png /favicon.svg; do
            curl --retry 4 --retry-all-errors -fsSL -A "$UA" "$SOURCE$remote" -o "site$remote"
          done
          while IFS= read -r -d '' file; do
            if file --mime-type "$file" | grep -q 'charset=binary'; then
              continue
            fi
            sed -i \
              -e 's#"/assets/#"./assets/#g' \
              -e "s#'/assets/#'./assets/#g" \
              -e 's#\\/assets/#./assets/#g' \
              -e 's#"/home-#"./home-#g' \
              -e 's#href="/favicon.svg"#href="./favicon.svg"#g' \
              -e 's#src="/favicon.svg"#src="./favicon.svg"#g' "$file"
          done < <(find site -type f -print0)

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网页文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
